    clearTimeout(saveGuard);

    console.log('[slideshow] salvo il filmato: ' + recChunks.length + ' pezzi, stato registratore ' +
                (recorder ? recorder.state : 'assente'));

    try{
      buildAndDownload();
    }catch(err){
      console.error('[slideshow] salvataggio fallito', err);
      statusText.textContent = 'Non riesco a salvare il filmato: ' + err.message;
    }
  }

  function buildAndDownload(){
    const tracce = capStream ? capStream.getTracks() : [];
    tracce.forEach(t => t.stop());

    const mimeBase = (recMime || 'video/webm').split(';')[0];
    const est = mimeBase.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    const blob = new Blob(recChunks, { type: mimeBase });

    capStream = null;
    recorder = null;
    recChunks = [];
    recWanted = false;

    if(!blob.size){
      statusText.textContent = "Registrazione vuota: non e’ stato salvato niente"
        + (recError ? " (" + recError + ")" : "") + ".";
      return;
    }

    const d = new Date();
    const due = n => String(n).padStart(2, '0');
    const nome = 'san-diego-2026-' + d.getFullYear() + due(d.getMonth() + 1) + due(d.getDate()) +
                 '-' + due(d.getHours()) + due(d.getMinutes()) + '.' + est;

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    const mb = (blob.size / 1048576).toFixed(1);

    statusText.textContent = 'Filmato salvato: ' + nome + ' (' + mb + ' MB)' +
      (est === "webm" ? " — questo browser non scrive MP4, il file e’ WebM." : "");
  }

  // --- Avvio --------------------------------------------------------

  async function start(){
    startBtn.disabled = true;
    statusText.textContent = '';

    // Lo stato del canale live va azzerato a ogni avvio, non solo al
    // caricamento della pagina. Senza, alla seconda proiezione 'liveSince'
    // resta all'ultima risposta della prima: il registro viene interrogato
    // con since=<ieri sera> e non riannuncia piu' niente, quindi le foto
    // arrivate in diretta perdono le regole loro (intera, 3 secondi) e
    // tornano a inquadratura a sorte - compresa la coppia.
    // Trovato dal vivo il 20/08/2026: alla prima proiezione andava, dalla
    // seconda no.
    liveSince = 0;
    knownNames.clear();
    retryQueue = [];

    try{
      images = await fetchImages();
    }catch(err){
      statusText.textContent = 'Errore nel caricamento immagini: ' + err.message;
      startBtn.disabled = false;
      recBtn.disabled = false;
      return;
    }

    if(images.length === 0){
      statusText.textContent = 'Nessuna immagine trovata nella cartella "' + FOLDER + '" del repository.';
      startBtn.disabled = false;
      recBtn.disabled = false;
      return;
    }

    // diapositiva di partenza (campo in home): fuori intervallo si riparte
    // dall'inizio, cosi' una cifra sbagliata non lascia lo schermo nero
    const chiesta = NaN;   // qui niente "parti dalla diapositiva": sempre dall'inizio

    startIndex = (chiesta >= 1 && chiesta <= images.length) ? chiesta - 1 : 0;

    // il numero fuori intervallo non va lasciato passare in silenzio, ma
    // nemmeno scritto qui: fra un istante questa riga dice "precarico..."
    const avvisoPartenza = (chiesta >= 1 && chiesta > images.length)
      ? 'Ci sono solo ' + images.length + ' diapositive: parto dalla prima'
      : (startIndex > 0 ? 'Parto dalla diapositiva ' + (startIndex + 1) : null);

    statusText.textContent = '';
    await Promise.all(images.map(preloadItem));

    // il registro live si legge PRIMA di mandare in scena qualcosa: e' li'
    // che si sa quali foto sono arrivate in diretta, e quindi vanno intere e
    // 3 secondi. Lasciarlo al primo giro del polling (che parte dopo) vuol
    // dire che le prime diapositive sarebbero gia' state costruite con le
    // regole sbagliate
    statusText.textContent = '';
    await pollLive();

    // il precaricamento dice solo che le foto ci sono; la prima (e la sua
    // eventuale compagna di coppia) dev'essere anche gia' decodificata,
    // altrimenti la proiezione si apre con un lampo bianco
    await warmSlide(startIndex);

    // fullscreen + musica richiedono un gesto utente: siamo dentro il click handler.
    // In registrazione il fullscreen si salta: la cattura riprende comunque
    // solo il contenuto della pagina (la cornice del browser non entra nel
    // filmato) e dopo il pannello di condivisione la richiesta verrebbe
    // rifiutata
    if(stage.requestFullscreen && !recWanted){
      stage.requestFullscreen().catch(() => {});
    }

    watchPlayers();
    unlockPlayers();

    if(delegateTrack) applyMusic(delegateTrack);

    overlay.classList.add('hidden');

    // il registratore parte con la schermata iniziale gia' sparita, cosi'
    // il filmato comincia dal nero e non dal pannello di avvio
    if(recWanted) beginRecording();

    showFirstSlide();

    if(avvisoPartenza) showNotice(avvisoPartenza);

    // il primo giro e' gia' stato fatto sopra (da since=0, cioe' con tutto il
    // registro): da qui in poi si chiede solo cosa arriva di nuovo
    liveTimer = setInterval(pollLive, LIVE_POLL_MS);
  }

  // --- Impostazioni del delegato (app.html) ---------------------------
  // ogni codice ha le sue: nome e messaggio sotto il titolo; con l'avvio
  // automatico niente pulsante, "Registra MP4" solo se il delegato l'ha acceso
  async function applySettings(){
    let st = {};

    if(USER){
      try{
        const r = await fetch(LIVE_HOST + 'api.php?a=settings&' + USER_Q, { cache:'no-store' });
        const j = await r.json();
        if(j && j.success) st = j.settings || {};
      }catch(e){}
    }

    const nameEl = document.getElementById('delegateName');
    const msgEl  = document.getElementById('delegateMsg');

    if(st.name){ nameEl.textContent = st.name; nameEl.classList.remove('hidden'); }
    if(st.message){ msgEl.textContent = st.message; msgEl.classList.remove('hidden'); }

    if(st.rec) recBtn.classList.remove('hidden');

    if(st.music) delegateTrack = st.music;

    if(st.autostart){
      recWanted = false;
      start();
    }else{
      startBtn.classList.remove('hidden');
    }
  }

  applySettings();

  startBtn.addEventListener('click', () => {
    recWanted = false;
    start();
  });

  recBtn.addEventListener('click', async () => {
    recBtn.disabled = true;
    startBtn.disabled = true;
    statusText.textContent = 'Scegli questa scheda (con l\'audio) nel pannello di Chrome...';

    const ok = await beginCapture();

    if(!ok){
      recBtn.disabled = false;
      startBtn.disabled = false;
      recBtn.disabled = false;
      return;
    }

    recWanted = true;
    await start();

    // start() esce anche quando qualcosa e' andato storto (elenco vuoto,
    // errore di rete): li' non c'e' nessuna proiezione da registrare e la
    // cattura va restituita, altrimenti Chrome resta a condividere la
    // scheda a vuoto
    if(!slideTimer) abortCapture();
  });

})();
</script>
